# LotusTok: nginx in front of the badge server. install.sh fills in __DOMAIN__
# and lets certbot add the https part.
#
# What the mod calls is  https://__DOMAIN__/api/...  -- nginx takes /api off
# and hands the rest to the service, which listens on 127.0.0.1:8080 only.
# The panel is  https://__DOMAIN__/admin

# Reads and writes are limited apart: a flood would aim at the writes. A GET
# has an empty key in the write zone and a POST has an empty key in the read
# zone, and nginx does not count a request whose key is empty.
map $request_method $lotus_read_key  { default $binary_remote_addr; POST ""; }
map $request_method $lotus_write_key { default ""; POST $binary_remote_addr; }

limit_req_zone $lotus_read_key  zone=lotus_read:10m  rate=60r/m;
limit_req_zone $lotus_write_key zone=lotus_write:10m rate=12r/m;

server {
    listen 80;
    listen [::]:80;
    server_name __DOMAIN__;

    # the biggest thing a phone sends is a crash report, 32 kB
    client_max_body_size 64k;

    limit_req zone=lotus_read  burst=40 nodelay;
    limit_req zone=lotus_write burst=8  nodelay;
    limit_req_status 429;

    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_read_timeout 60s;

    # what the mod and the patcher call
    location /api/ {
        rewrite ^/api/(.*)$ /$1 break;
        proxy_pass http://127.0.0.1:8080;
    }

    # the panel; a plugin is uploaded here, so it may be larger
    location /admin {
        client_max_body_size 30m;
        proxy_pass http://127.0.0.1:8080;
    }

    # pictures the bot hands to Telegram, health check
    location ~ ^/(face|picture|icon|plugin|plugins|health)(/|$) {
        proxy_pass http://127.0.0.1:8080;
    }

    # updates: version.json and the apk, copied here by hand. See README.
    location /updates/ {
        alias /var/www/lotustok/updates/;
        default_type application/octet-stream;
        add_header Cache-Control "no-cache";
    }

    # the original TikTok apk a patch is made against, if the patcher is used
    location /original/ {
        alias /var/www/lotustok/original/;
        default_type application/octet-stream;
    }

    location = / {
        default_type text/plain;
        return 200 "LotusTok\n";
    }
}
